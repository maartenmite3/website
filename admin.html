<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-danger mb-4">
        <div class="container">
            <span class="navbar-brand"><i class="bi bi-shield-lock-fill"></i> Admin Beheer</span>
            <a href="/" class="btn btn-outline-light btn-sm">Terug naar Dashboard</a>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            
            <div class="col-md-4 mb-3">
                <div class="card shadow-sm sticky-top" style="top: 20px;">
                    <div class="card-header bg-dark text-white">Nieuwe Gebruiker</div>
                    <div class="card-body">
                        <form id="addUserForm">
                            <div class="mb-2">
                                <label>Gebruikersnaam</label>
                                <input type="text" id="newUser" class="form-control" required>
                            </div>
                            <div class="mb-2">
                                <label>Wachtwoord</label>
                                <input type="text" id="newPass" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label>Rol</label>
                                <select id="newRole" class="form-select">
                                    <option value="user">Gebruiker</option>
                                    <option value="admin">Admin</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Aanmaken</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-white p-0">
                        <ul class="nav nav-tabs card-header-tabs m-0">
                            <li class="nav-item">
                                <a class="nav-link active" data-bs-toggle="tab" href="#usersTab">Gebruikers</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" data-bs-toggle="tab" href="#logsTab" onclick="loadLogs()">Logboek</a>
                            </li>
                        </ul>
                    </div>
                    
                    <div class="card-body p-0">
                        <div class="tab-content">
                            
                            <div class="tab-pane fade show active" id="usersTab">
                                <table class="table table-striped mb-0">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Naam</th>
                                            <th>Rol</th>
                                            <th>MFA</th>
                                            <th>Actie</th>
                                        </tr>
                                    </thead>
                                    <tbody id="userTable">
                                        <tr><td colspan="5" class="text-center p-3">Laden...</td></tr>
                                    </tbody>
                                </table>
                            </div>

                            <div class="tab-pane fade" id="logsTab">
                                <table class="table table-sm table-hover mb-0" style="font-size: 0.9em;">
                                    <thead>
                                        <tr>
                                            <th>Tijd</th>
                                            <th>Wie</th>
                                            <th>Actie</th>
                                            <th>Details</th>
                                        </tr>
                                    </thead>
                                    <tbody id="logTable">
                                        <tr><td colspan="4" class="text-center p-3">Klik op tabblad om te laden...</td></tr>
                                    </tbody>
                                </table>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Start: Laad gebruikers meteen
        loadUsers();

        // Functie: Gebruikers laden
        async function loadUsers() {
            try {
                const res = await fetch('/api/admin-users');
                if (!res.ok) {
                    if(res.status === 403) { 
                        document.body.innerHTML = "<div class='container mt-5 text-center'><h1>⛔ Geen toegang</h1><p>Je bent geen admin.</p><a href='/' class='btn btn-primary'>Terug</a></div>";
                    }
                    return;
                }
                const users = await res.json();
                
                const tbody = document.getElementById('userTable');
                tbody.innerHTML = '';

                users.forEach(u => {
                    const row = `
                        <tr>
                            <td>${u.id}</td>
                            <td>${u.username}</td>
                            <td><span class="badge ${u.role === 'admin' ? 'bg-danger' : 'bg-primary'}">${u.role}</span></td>
                            <td>${u.mfa_enabled ? '<i class="bi bi-check-circle-fill text-success"></i>' : '<span class="text-muted">-</span>'}</td>
                            <td>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteUser(${u.id})">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } catch(e) {
                console.error(e);
            }
        }

        // Functie: Logs laden
        async function loadLogs() {
            const tbody = document.getElementById('logTable');
            tbody.innerHTML = '<tr><td colspan="4" class="text-center p-3">Laden...</td></tr>';

            try {
                const res = await fetch('/api/admin-logs');
                if(!res.ok) return;
                const logs = await res.json();
                
                tbody.innerHTML = '';
                if(logs.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center p-3">Nog geen logs gevonden.</td></tr>';
                    return;
                }

                logs.forEach(log => {
                    const date = new Date(log.created_at).toLocaleString('nl-NL');
                    const row = `
                        <tr>
                            <td class="text-muted" style="white-space:nowrap;">${date}</td>
                            <td class="fw-bold">${log.username}</td>
                            <td><span class="badge bg-secondary">${log.action}</span></td>
                            <td>${log.details}</td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } catch(e) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-danger p-3">Fout bij laden logs.</td></tr>';
            }
        }

        // Event: Nieuwe gebruiker toevoegen
        document.getElementById('addUserForm').onsubmit = async (e) => {
            e.preventDefault();
            const username = document.getElementById('newUser').value;
            const password = document.getElementById('newPass').value;
            const role = document.getElementById('newRole').value;

            const res = await fetch('/api/admin-users', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username, password, role })
            });

            if(res.ok) {
                alert('Gebruiker succesvol toegevoegd!');
                document.getElementById('addUserForm').reset();
                loadUsers(); // Ververs de lijst
                // Als we op de logs tab zitten, die ook verversen
                if(document.querySelector('#logsTab').classList.contains('active')) loadLogs();
            } else {
                alert('Fout: ' + await res.text());
            }
        };

        // Functie: Verwijderen
        async function deleteUser(id) {
            if(!confirm('Weet je zeker dat je deze gebruiker wilt verwijderen?')) return;
            
            const res = await fetch('/api/admin-users', {
                method: 'DELETE',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ id })
            });

            if(res.ok) {
                loadUsers();
                if(document.querySelector('#logsTab').classList.contains('active')) loadLogs();
            } else {
                alert(await res.text());
            }
        }
    </script>
</body>
</html>

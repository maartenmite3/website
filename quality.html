<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Datakwaliteit - Security Center</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .cursor-pointer { cursor: pointer; }
        .card-select:hover { border-color: #0d6efd; background-color: #f8f9fa; }
        .card-select.active { border-color: #0d6efd; background-color: #e7f1ff; }
        .pagination { margin-top: 1rem; margin-bottom: 0; }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand"><i class="bi bi-heart-pulse"></i> Datakwaliteit</span>
            <div class="d-flex gap-3 align-items-center">
                <a class="nav-link text-white" href="/assets.html" data-i18n="btn_back">Terug naar Assets</a>
                <div class="dropdown">
                    <button class="btn btn-sm btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown"><i class="bi bi-translate"></i> <span id="currentLang">NL</span></button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item cursor-pointer" onclick="setLanguage('nl')">🇳🇱 Nederlands</a></li>
                        <li><a class="dropdown-item cursor-pointer" onclick="setLanguage('en')">🇬🇧 English</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <h3 class="mb-4" data-i18n="title_quality">Kwaliteitscontrole</h3>

        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="card shadow-sm cursor-pointer card-select active" onclick="showTab('incomplete')" id="card-incomplete">
                    <div class="card-body text-center">
                        <h2 class="text-warning display-5 fw-bold" id="countIncomplete">-</h2>
                        <h6 class="text-muted" data-i18n="kpi_incomplete">Missende Data</h6>
                        <small class="text-muted" data-i18n="desc_incomplete">Geen eigenaar/sub</small>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card shadow-sm cursor-pointer card-select" onclick="showTab('orphans')" id="card-orphans">
                    <div class="card-body text-center">
                        <h2 class="text-primary display-5 fw-bold" id="countOrphans">-</h2>
                        <h6 class="text-muted" data-i18n="kpi_orphans">Wees-Assets</h6>
                        <small class="text-muted" data-i18n="desc_orphans">Nergens mee verbonden</small>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card shadow-sm cursor-pointer card-select" onclick="showTab('stale')" id="card-stale">
                    <div class="card-body text-center">
                        <h2 class="text-secondary display-5 fw-bold" id="countStale">-</h2>
                        <h6 class="text-muted" data-i18n="kpi_stale">Zombies</h6>
                        <small class="text-muted" data-i18n="desc_stale">> 6 maanden inactief</small>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card shadow-sm cursor-pointer card-select" onclick="showTab('duplicates')" id="card-duplicates">
                    <div class="card-body text-center">
                        <h2 class="text-danger display-5 fw-bold" id="countDuplicates">-</h2>
                        <h6 class="text-muted" data-i18n="kpi_dupes">Dubbele IP's</h6>
                        <small class="text-muted" data-i18n="desc_dupes">Conflicterende adressen</small>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <h5 id="tableTitle" class="mb-0">Details</h5>
                <span class="badge bg-secondary" id="pageIndicator"></span>
            </div>
            <div class="card-body p-0">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                        <tr>
                            <th data-i18n="th_asset">Asset</th>
                            <th>Type</th>
                            <th data-i18n="th_issue">Probleem / Detail</th>
                            <th class="text-end" data-i18n="th_action">Actie</th>
                        </tr>
                    </thead>
                    <tbody id="detailTable">
                        <tr><td colspan="4" class="p-4 text-center" data-i18n="loading">Laden...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="card-footer bg-white border-top-0 d-flex justify-content-center py-3">
                <nav aria-label="Pagination">
                    <ul class="pagination" id="qualityPagination">
                        </ul>
                </nav>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // --- TRANSLATIONS ---
        const translations = {
            nl: {
                btn_back: "Terug naar Assets", title_quality: "Kwaliteitscontrole",
                kpi_incomplete: "Missende Data", desc_incomplete: "Geen eigenaar/sub",
                kpi_orphans: "Wees-Assets", desc_orphans: "Nergens mee verbonden",
                kpi_stale: "Zombies", desc_stale: "> 6 mnd niet gezien",
                kpi_dupes: "Dubbele IP's", desc_dupes: "Conflicterende adressen",
                th_asset: "Asset", th_issue: "Probleem", th_action: "Actie", loading: "Laden...",
                btn_edit: "Bewerk", txt_missing: "Mist: ", txt_last_seen: "Laatst gezien: ", txt_dupe_count: "Aantal keer gevonden: ",
                txt_clean: "Alles schoon!", txt_prev: "Vorige", txt_next: "Volgende"
            },
            en: {
                btn_back: "Back to Assets", title_quality: "Data Quality",
                kpi_incomplete: "Missing Data", desc_incomplete: "No owner/sub",
                kpi_orphans: "Orphan Assets", desc_orphans: "Not connected",
                kpi_stale: "Zombies", desc_stale: "> 6 months inactive",
                kpi_dupes: "Duplicate IPs", desc_dupes: "Conflicting addresses",
                th_asset: "Asset", th_issue: "Issue", th_action: "Action", loading: "Loading...",
                btn_edit: "Edit", txt_missing: "Missing: ", txt_last_seen: "Last seen: ", txt_dupe_count: "Found count: ",
                txt_clean: "All clean!", txt_prev: "Previous", txt_next: "Next"
            }
        };

        function setLanguage(lang) { localStorage.setItem('lang', lang); location.reload(); }
        function applyLanguage() {
            const lang = localStorage.getItem('lang') || 'nl';
            document.getElementById('currentLang').innerText = lang.toUpperCase();
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) el.innerText = translations[lang][key];
            });
        }
        function t(key) { const lang = localStorage.getItem('lang') || 'nl'; return translations[lang][key] || key; }

        // --- GLOBAL DATA & PAGINATION VARS ---
        let qualityData = {};
        let currentTab = 'incomplete';
        
        // Paginering Instellingen
        let currentPage = 1;
        const itemsPerPage = 25;

        applyLanguage();
        loadData();

        async function loadData() {
            try {
                const res = await fetch('/api/quality');
                qualityData = await res.json();
                
                // Update KPI Counters
                document.getElementById('countIncomplete').innerText = qualityData.incomplete.length;
                document.getElementById('countOrphans').innerText = qualityData.orphans.length;
                document.getElementById('countStale').innerText = qualityData.stale.length;
                document.getElementById('countDuplicates').innerText = qualityData.duplicates.length;

                // Render default tab
                renderTable();
            } catch(e) { console.error(e); }
        }

        function showTab(tab) {
            currentTab = tab;
            currentPage = 1; // Reset pagina naar 1 bij wisselen tab
            
            // Update UI active state
            document.querySelectorAll('.card-select').forEach(c => c.classList.remove('active'));
            document.getElementById('card-' + tab).classList.add('active');
            
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('detailTable');
            tbody.innerHTML = '';
            
            // Bepaal welke dataset we gebruiken
            let fullData = [];
            if(currentTab === 'incomplete') fullData = qualityData.incomplete || [];
            if(currentTab === 'orphans') fullData = qualityData.orphans || [];
            if(currentTab === 'stale') fullData = qualityData.stale || [];
            if(currentTab === 'duplicates') fullData = qualityData.duplicates || [];

            if(fullData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-success"><i class="bi bi-check-circle display-4"></i><br>${t('txt_clean')}</td></tr>`;
                document.getElementById('qualityPagination').innerHTML = ''; // Geen paginering nodig
                document.getElementById('pageIndicator').innerText = '';
                return;
            }

            // PAGINERING LOGICA
            const totalItems = fullData.length;
            const totalPages = Math.ceil(totalItems / itemsPerPage);
            
            // Zorg dat currentPage geldig blijft
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageData = fullData.slice(startIndex, endIndex);

            // Update Page Indicator (bovenin tabel)
            document.getElementById('pageIndicator').innerText = `${startIndex + 1}-${Math.min(endIndex, totalItems)} / ${totalItems}`;

            // Render Rijen
            pageData.forEach(item => {
                let issueText = '';
                
                if(currentTab === 'incomplete') {
                    const missing = item.missing.map(m => {
                        if(m==='owner') return 'Eigenaar';
                        if(m==='subscription') return 'Subscriptie';
                        return m;
                    }).join(', ');
                    issueText = `<span class="badge bg-warning text-dark">${t('txt_missing')} ${missing}</span>`;
                }
                else if(currentTab === 'orphans') issueText = `<span class="text-muted">Geen relaties in netwerk diagram</span>`;
                else if(currentTab === 'stale') {
                    const date = new Date(item.last_seen || 0).toLocaleDateString();
                    issueText = `<span class="text-danger">${t('txt_last_seen')} ${date}</span>`;
                }
                else if(currentTab === 'duplicates') issueText = `${t('txt_dupe_count')} ${item.count}`;

                const btnDisabled = currentTab === 'duplicates' ? 'disabled' : '';
                const assetName = item.name || 'Onbekend';
                const assetType = item.type || '-';

                tbody.innerHTML += `
                    <tr>
                        <td class="fw-bold">${assetName}</td>
                        <td>${assetType}</td>
                        <td>${issueText}</td>
                        <td class="text-end">
                            <a href="/assets.html?q=${encodeURIComponent(assetName)}" class="btn btn-sm btn-outline-primary ${btnDisabled}">
                                <i class="bi bi-pencil"></i> ${t('btn_edit')}
                            </a>
                        </td>
                    </tr>
                `;
            });

            renderPaginationControls(totalPages);
        }

        function renderPaginationControls(totalPages) {
            const nav = document.getElementById('qualityPagination');
            nav.innerHTML = '';

            if (totalPages <= 1) return;

            // Vorige
            const prevDisabled = currentPage === 1 ? 'disabled' : '';
            nav.innerHTML += `<li class="page-item ${prevDisabled}"><button class="page-link" onclick="changePage(${currentPage - 1})">${t('txt_prev')}</button></li>`;

            // Pagina Nummers (Max 5 tonen om het netjes te houden)
            let startPage = Math.max(1, currentPage - 2);
            let endPage = Math.min(totalPages, startPage + 4);
            if(endPage - startPage < 4) startPage = Math.max(1, endPage - 4);

            for (let i = startPage; i <= endPage; i++) {
                const active = i === currentPage ? 'active' : '';
                nav.innerHTML += `<li class="page-item ${active}"><button class="page-link" onclick="changePage(${i})">${i}</button></li>`;
            }

            // Volgende
            const nextDisabled = currentPage === totalPages ? 'disabled' : '';
            nav.innerHTML += `<li class="page-item ${nextDisabled}"><button class="page-link" onclick="changePage(${currentPage + 1})">${t('txt_next')}</button></li>`;
        }

        function changePage(p) {
            currentPage = p;
            renderTable();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="nl">
<head>
    <title>Abonnementen Beheer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand">Subscriptie Beheer</span>
            <a href="/assets.html" class="btn btn-outline-light btn-sm">Terug naar Assets</a>
        </div>
    </nav>
    <div class="container">
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-secondary text-white">Nieuw Abonnement</div>
            <div class="card-body">
                <form id="subForm" class="row g-2">
                    <div class="col-md-3"><input type="text" id="subName" class="form-control" placeholder="Naam (bv. Prod-IT)" required></div>
                    <div class="col-md-4"><input type="text" id="subGuid" class="form-control" placeholder="GUID (xxxxxxxx-xxxx...)" required></div>
                    <div class="col-md-4"><input type="text" id="subResp" class="form-control" placeholder="Verantwoordelijken (Jan, Piet)" required></div>
                    <div class="col-md-1"><button type="submit" class="btn btn-success w-100"><i class="bi bi-plus"></i></button></div>
                </form>
            </div>
        </div>
        <div class="card shadow-sm"><table class="table table-hover mb-0"><tbody id="subTable"></tbody></table></div>
    </div>
    <script>
        loadSubs();
        async function loadSubs() {
            const res = await fetch('/api/subscriptions');
            const data = await res.json();
            document.getElementById('subTable').innerHTML = data.map(s => `
                <tr>
                    <td><strong>${s.name}</strong><br><small class="text-muted">${s.guid}</small></td>
                    <td><i class="bi bi-people"></i> ${s.responsibles}</td>
                    <td class="text-end"><button class="btn btn-sm btn-outline-danger" onclick="delSub(${s.id})"><i class="bi bi-trash"></i></button></td>
                </tr>`).join('');
        }
        document.getElementById('subForm').onsubmit = async (e) => {
            e.preventDefault();
            await fetch('/api/subscriptions', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({
                    name: document.getElementById('subName').value,
                    guid: document.getElementById('subGuid').value,
                    responsibles: document.getElementById('subResp').value
                })
            });
            document.getElementById('subForm').reset(); loadSubs();
        };
        async function delSub(id) { if(confirm('Wissen?')) { await fetch('/api/subscriptions', { method: 'DELETE', body: JSON.stringify({id}) }); loadSubs(); }}
    </script>
</body>
</html>

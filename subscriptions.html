<!DOCTYPE html>
<html lang="nl">
<head>
    <title>Subscriptie Beheer</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .cursor-pointer { cursor: pointer; }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand">Subscriptie Beheer</span>
            <div class="d-flex gap-3 align-items-center">
                <a href="/assets.html" class="btn btn-outline-light btn-sm" data-i18n="btn_back">Terug naar Assets</a>
                
                <div class="dropdown">
                    <button class="btn btn-sm btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        <i class="bi bi-translate"></i> <span id="currentLang">NL</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item cursor-pointer" onclick="setLanguage('nl')">🇳🇱 Nederlands</a></li>
                        <li><a class="dropdown-item cursor-pointer" onclick="setLanguage('en')">🇬🇧 English</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between mb-3">
            <button class="btn btn-primary" onclick="openModal()">
                <i class="bi bi-plus-lg"></i> <span data-i18n="btn_new">Nieuw</span>
            </button>
            <button class="btn btn-success" onclick="openImportModal()">
                <i class="bi bi-file-earmark-spreadsheet"></i> <span data-i18n="btn_import">Import CSV</span>
            </button>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                        <tr>
                            <th data-i18n="th_name">Naam</th>
                            <th>GUID</th>
                            <th data-i18n="th_resp">Verantwoordelijken</th>
                            <th class="text-end" data-i18n="th_action">Actie</th>
                        </tr>
                    </thead>
                    <tbody id="subTable">
                        <tr><td colspan="4" class="p-3 text-center" data-i18n="loading">Laden...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="subModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Subscriptie</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="subForm">
                        <input type="hidden" id="subId">
                        <div class="mb-2">
                            <label class="form-label" data-i18n="lbl_name">Naam</label>
                            <input type="text" id="subName" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">GUID</label>
                            <input type="text" id="subGuid" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label" data-i18n="lbl_resp">Verantwoordelijken</label>
                            <input type="text" id="subResp" class="form-control" placeholder="bv. Jan, Piet">
                        </div>
                        <button type="submit" class="btn btn-success w-100 mt-3" data-i18n="btn_save">Opslaan</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="importModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" data-i18n="modal_import">Subscripties Importeren</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">CSV Bestand</label>
                        <input type="file" id="csvFile" class="form-control" accept=".csv">
                        <div class="form-text">Verwachte kolommen: <code>subscription_name, subscription_id</code></div>
                    </div>
                    <button class="btn btn-primary mb-3" onclick="analyzeCSV()" data-i18n="btn_analyze">Analyseren</button>
                    
                    <div id="importPreview" class="d-none">
                        <ul class="nav nav-tabs">
                            <li class="nav-item">
                                <a class="nav-link active" href="#" data-i18n="tab_new">Nieuw</a> (<span id="countNew">0</span>)
                            </li>
                        </ul>
                        <div class="border p-2 mb-3" style="max-height: 200px; overflow-y: auto;">
                            <table class="table table-sm table-striped">
                                <tbody id="listNew"></tbody>
                            </table>
                        </div>
                        <button class="btn btn-success w-100" id="btnConfirmImport" onclick="executeImport()" disabled data-i18n="btn_start">Start Import</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // --- TRANSLATIONS ---
        const translations = {
            nl: {
                btn_back: "Terug naar Assets", btn_new: "Nieuw", btn_import: "Import CSV",
                th_name: "Naam", th_resp: "Verantwoordelijken", th_action: "Actie", loading: "Laden...",
                lbl_name: "Naam", lbl_resp: "Verantwoordelijken", btn_save: "Opslaan",
                modal_import: "Subscripties Importeren", btn_analyze: "Analyseren", tab_new: "Nieuw", btn_start: "Start Import",
                alert_error: "Er is een fout opgetreden", alert_saved: "Opgeslagen", alert_confirm: "Zeker weten?", txt_no_data: "Geen data gevonden"
            },
            en: {
                btn_back: "Back to Assets", btn_new: "New", btn_import: "Import CSV",
                th_name: "Name", th_resp: "Responsibles", th_action: "Action", loading: "Loading...",
                lbl_name: "Name", lbl_resp: "Responsibles", btn_save: "Save",
                modal_import: "Import Subscriptions", btn_analyze: "Analyze", tab_new: "New", btn_start: "Start Import",
                alert_error: "An error occurred", alert_saved: "Saved", alert_confirm: "Are you sure?", txt_no_data: "No data found"
            }
        };

        function setLanguage(lang) {
            localStorage.setItem('lang', lang);
            applyLanguage();
        }

        function applyLanguage() {
            const lang = localStorage.getItem('lang') || 'nl';
            document.getElementById('currentLang').innerText = lang.toUpperCase();
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) el.innerText = translations[lang][key];
            });
        }

        function t(key) {
            const lang = localStorage.getItem('lang') || 'nl';
            return translations[lang][key] || key;
        }

        // --- GLOBAL VARS ---
        let importData = { new: [] };
        let allSubs = [];

        // --- INIT ---
        applyLanguage();
        loadSubs();

        // --- LOAD DATA ---
        async function loadSubs() {
            try {
                const res = await fetch('/api/subscriptions');
                if (res.status === 401) return window.location.href = '/login.html';
                
                allSubs = await res.json();
                const tbody = document.getElementById('subTable');
                
                tbody.innerHTML = allSubs.map(s => `
                    <tr>
                        <td class="fw-bold">${s.name}</td>
                        <td class="font-monospace text-muted">${s.guid}</td>
                        <td>${s.responsibles || '-'}</td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-primary" onclick="openEdit(${s.id})">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="delSub(${s.id})">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (e) {
                console.error(e);
            }
        }

        // --- CRUD FUNCTIES ---
        function openModal() {
            document.getElementById('subForm').reset();
            document.getElementById('subId').value = '';
            document.getElementById('modalTitle').innerText = t('btn_new');
            new bootstrap.Modal(document.getElementById('subModal')).show();
        }

        function openEdit(id) {
            const s = allSubs.find(x => x.id === id);
            document.getElementById('subId').value = s.id;
            document.getElementById('subName').value = s.name;
            document.getElementById('subGuid').value = s.guid;
            document.getElementById('subResp').value = s.responsibles;
            document.getElementById('modalTitle').innerText = 'Edit';
            new bootstrap.Modal(document.getElementById('subModal')).show();
        }

        document.getElementById('subForm').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('subId').value;
            const data = {
                id: id ? id : null,
                name: document.getElementById('subName').value,
                guid: document.getElementById('subGuid').value,
                responsibles: document.getElementById('subResp').value
            };

            const method = id ? 'PUT' : 'POST';
            
            // HIER ZAT DE FOUT: Variabele heet nu consequent 'res'
            const res = await fetch('/api/subscriptions', {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                bootstrap.Modal.getInstance(document.getElementById('subModal')).hide();
                loadSubs();
            } else {
                alert(t('alert_error') + ": " + await res.text());
            }
        };

        async function delSub(id) {
            if (confirm(t('alert_confirm'))) {
                await fetch('/api/subscriptions', {
                    method: 'DELETE',
                    body: JSON.stringify({ id })
                });
                loadSubs();
            }
        }

        // --- IMPORT FUNCTIES ---
        function openImportModal() {
            document.getElementById('importPreview').classList.add('d-none');
            document.getElementById('csvFile').value = '';
            new bootstrap.Modal(document.getElementById('importModal')).show();
        }

        function analyzeCSV() {
            const file = document.getElementById('csvFile').files[0];
            if (!file) return alert('Selecteer een bestand');

            const reader = new FileReader();
            reader.onload = async (e) => {
                const rows = csvToJSON(e.target.result);
                if (rows.length === 0) {
                    alert(t('txt_no_data'));
                    return;
                }

                const res = await fetch('/api/import-handler', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mode: 'check', type: 'subscriptions', data: rows })
                });

                const report = await res.json();
                importData.new = report.new;

                document.getElementById('listNew').innerHTML = report.new.map(i => `
                    <tr><td>${i.name}</td><td>${i.guid}</td></tr>
                `).join('');
                
                document.getElementById('importPreview').classList.remove('d-none');
                document.getElementById('btnConfirmImport').disabled = report.new.length === 0;
                document.getElementById('btnConfirmImport').innerText = `${t('btn_start')} (${report.new.length})`;
            };
            reader.readAsText(file);
        }

        async function executeImport() {
            if (!confirm(t('alert_confirm'))) return;

            const res = await fetch('/api/import-handler', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mode: 'execute', type: 'subscriptions', data: importData.new })
            });

            if (res.ok) {
                alert(t('alert_saved'));
                bootstrap.Modal.getInstance(document.getElementById('importModal')).hide();
                loadSubs();
            } else {
                alert(t('alert_error'));
            }
        }

        function csvToJSON(csv) {
            const lines = csv.split(/\r?\n/);
            if (lines.length < 1) return [];
            
            const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, '').replace(/^\uFEFF/, ''));
            const result = [];

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                
                const currentline = lines[i].split(',');
                const obj = {};
                
                for (let j = 0; j < headers.length; j++) {
                    const val = currentline[j] ? currentline[j].trim().replace(/^"|"$/g, '') : '';
                    obj[headers[j]] = val;
                }
                result.push(obj);
            }
            return result;
        }
    </script>
</body>
</html>

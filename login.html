<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inloggen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .login-card { max-width: 400px; width: 100%; }
    </style>
</head>
<body class="d-flex align-items-center min-vh-100">

    <div class="container d-flex justify-content-center">
        <div class="card login-card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4">Welkom</h3>
                
                <div id="error-alert" class="alert alert-danger d-none" role="alert"></div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="user" class="form-label">Gebruikersnaam</label>
                        <input type="text" class="form-control" id="user" placeholder="Bijv. admin" required>
                    </div>
                    <div class="mb-3">
                        <label for="pass" class="form-label">Wachtwoord</label>
                        <input type="password" class="form-control" id="pass" placeholder="Je wachtwoord" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Inloggen</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('error-alert');
            
            // Reset alert
            alertBox.classList.add('d-none');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    body: JSON.stringify({
                        username: document.getElementById('user').value,
                        password: document.getElementById('pass').value
                    })
                });

                if (res.ok) {
                    window.location.href = '/'; 
                } else {
                    alertBox.textContent = 'Gebruikersnaam of wachtwoord onjuist.';
                    alertBox.classList.remove('d-none');
                }
            } catch (err) {
                alertBox.textContent = 'Er ging iets mis met de verbinding.';
                alertBox.classList.remove('d-none');
            }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="nl">
<head>
    <title>Dashboard</title>
    <style>
        body { margin: 0; font-family: sans-serif; }
        nav { background: #333; color: white; padding: 10px; display: flex; justify-content: space-between; }
        nav a { color: white; text-decoration: none; margin-left: 15px; cursor: pointer; }
        .content { padding: 20px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: white; margin: 10% auto; padding: 20px; width: 300px; border-radius: 5px; }
    </style>
</head>
<body>
    <nav>
        <div>Mijn Project</div>
        <div>
            <span>Placeholder 1</span>
            <span>Placeholder 2</span>
            <a onclick="openSettings()">⚙️ Settings</a>
            <a href="/api/logout">Uitloggen</a>
        </div>
    </nav>

    <div class="content">
        <h1>Welkom <span id="username">...</span></h1>
        <p>Dit is de geheime omgeving.</p>
    </div>

    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <h2>Settings</h2>
            <hr>
            <h3>Wachtwoord wijzigen</h3>
            <input type="password" id="newPass" placeholder="Nieuw wachtwoord">
            <button onclick="updatePass()">Opslaan</button>
            <hr>
            <h3>MFA (Multi-Factor)</h3>
            <p>Status: <span id="mfaStatus">Uitgeschakeld</span></p>
            <button onclick="alert('MFA implementatie vereist externe library voor QR codes, dit is een placeholder.')">MFA Instellen</button>
            <hr>
            <button onclick="document.getElementById('settingsModal').style.display='none'">Sluiten</button>
        </div>
    </div>

    <script>
        // Laad gebruiker info bij start
        fetch('/api/user').then(r => r.json()).then(user => {
            document.getElementById('username').innerText = user.username;
            document.getElementById('mfaStatus').innerText = user.mfa_enabled ? "AAN" : "UIT";
        });

        function openSettings() { document.getElementById('settingsModal').style.display = 'block'; }

        async function updatePass() {
            const pass = document.getElementById('newPass').value;
            if(!pass) return;
            await fetch('/api/user', { method: 'PUT', body: JSON.stringify({ new_password: pass }) });
            alert('Wachtwoord gewijzigd!');
            document.getElementById('newPass').value = '';
        }
    </script>
</body>
</html>

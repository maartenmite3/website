<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Asset Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .confidential { border-left: 5px solid #dc3545; background-color: #fffbfb; }
        .internal { border-left: 5px solid #ffc107; }
        .public { border-left: 5px solid #198754; }
        
        /* De stijl voor verborgen data */
        .masked-data { 
            filter: blur(5px); 
            cursor: pointer; 
            transition: 0.2s; 
            user-select: none; 
            display: inline-block; 
        }
        /* Als we erover hoveren OF als de class 'revealed' is toegevoegd */
        .masked-data:hover, .masked-data.revealed { 
            filter: none; 
        }
        
        .clickable-asset { cursor: pointer; color: #0d6efd; font-weight: bold; text-decoration: underline; }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand"><i class="bi bi-shield-shaded"></i> Asset Inventory</span>
            <div>
                <a href="/subscriptions.html" class="btn btn-outline-info btn-sm me-2">Beheer Subscripties</a>
                <a href="/" class="btn btn-outline-light btn-sm">Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <div class="d-flex justify-content-between mb-3 align-items-center">
            <button class="btn btn-primary" onclick="openCreateModal()"><i class="bi bi-plus-lg"></i> Nieuwe Asset</button>
<button class="btn btn-success ms-2" onclick="openImportModal()"><i class="bi bi-file-earmark-spreadsheet"></i> Import CSV</button>
            
            <div class="d-flex gap-2">
                <button class="btn btn-outline-secondary" onclick="toggleGlobalReveal()" id="globalEyeBtn" title="Toon/Verberg alle gevoelige data">
                    <i class="bi bi-eye"></i>
                </button>
                
                <input type="text" id="searchBar" class="form-control" placeholder="Zoeken..." onkeyup="filterTable()">
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <table class="table table-hover mb-0 align-middle text-nowrap">
                    <thead class="table-light">
                        <tr>
                            <th>Asset</th>
                            <th>IP Adres</th>
                            <th>Subscriptie</th>
                            <th>Eigenaar</th>
                            <th>Labels</th>
                            <th>CIS</th>
                            <th>Vulns</th>
                            <th>Class</th>
                            <th class="text-end">Actie</th>
                        </tr>
                    </thead>
                    <tbody id="assetTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="assetModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="modalTitle">Asset</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="assetForm">
                        <input type="hidden" id="assetId">
                        <div class="row g-3">
                            <div class="col-md-6"><label>Naam</label><input type="text" id="name" class="form-control" required></div>
                            <div class="col-md-3"><label>Type</label><select id="type" class="form-select"><option>Virtual Machine</option><option>SQL Database</option><option>App Service</option><option>Firewall</option></select></div>
                            <div class="col-md-3"><label>CIS Score</label><input type="number" id="cis" class="form-control" placeholder="0-100"></div>
                            
                            <div class="col-md-6"><label>Subscriptie</label><select id="subSelect" class="form-select"></select></div>
                            <div class="col-md-6"><label class="text-danger">Eigenaar</label><input type="text" id="owner" class="form-control"></div>
                            <div class="col-md-12"><label class="text-danger">IP Adres</label><input type="text" id="ip" class="form-control"></div>

                            <div class="col-md-6"><label>Classificatie</label><select id="classif" class="form-select"><option>Public</option><option>Internal</option><option>Confidential</option></select></div>
                            <div class="col-md-6">
                                <label>Data Gevoeligheid</label>
                                <div class="d-flex gap-2 flex-wrap">
                                    <div class="form-check"><input class="form-check-input sens-check" type="checkbox" value="PII" id="c1"><label for="c1">PII</label></div>
                                    <div class="form-check"><input class="form-check-input sens-check" type="checkbox" value="PHI" id="c2"><label for="c2">PHI</label></div>
                                    <div class="form-check"><input class="form-check-input sens-check" type="checkbox" value="PCI" id="c3"><label for="c3">PCI</label></div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuleren</button>
                    <button type="button" class="btn btn-success" onclick="saveAsset()">Opslaan</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="detailModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="detailTitle">Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-0">
                    <ul class="nav nav-tabs nav-fill bg-light" role="tablist">
                        <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#tabVuln">🛑 Kwetsbaarheden</a></li>
                        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tabCis">✅ CIS Uitzonderingen</a></li>
                        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tabHist">🕒 Geschiedenis</a></li>
                    </ul>
                    
                    <div class="tab-content p-3">
                        <div class="tab-pane fade show active" id="tabVuln">
                            <form id="vulnForm" class="row g-2 mb-3 bg-light p-2 border rounded">
                                <div class="col-md-3"><input type="text" id="vName" class="form-control form-control-sm" placeholder="Kwetsbaarheid"></div>
                                <div class="col-md-2"><select id="vSev" class="form-select form-select-sm"><option>Critical</option><option>High</option><option>Medium</option></select></div>
                                <div class="col-md-3"><select id="vStat" class="form-select form-select-sm"><option>Open</option><option>Tijdelijke Uitzondering</option><option>Permanente Uitzondering</option></select></div>
                                <div class="col-md-2"><input type="date" id="vDate" class="form-control form-control-sm"></div>
                                <div class="col-md-2"><button type="button" onclick="addVuln()" class="btn btn-sm btn-success w-100">Toevoegen</button></div>
                            </form>
                            <table class="table table-sm table-striped">
                                <thead><tr><th>Naam</th><th>Severity</th><th>Status</th><th>Einddatum</th><th>Actie</th></tr></thead>
                                <tbody id="vulnTable"></tbody>
                            </table>
                        </div>

                        <div class="tab-pane fade" id="tabCis">
                            <form id="cisForm" class="row g-2 mb-3 bg-light p-2 border rounded">
                                <div class="col-md-2"><input type="text" id="cId" class="form-control form-control-sm" placeholder="ID"></div>
                                <div class="col-md-5"><input type="text" id="cDesc" class="form-control form-control-sm" placeholder="Omschrijving"></div>
                                <div class="col-md-3"><input type="text" id="cJust" class="form-control form-control-sm" placeholder="Reden"></div>
                                <div class="col-md-2"><button type="button" onclick="addCis()" class="btn btn-sm btn-success w-100">Toevoegen</button></div>
                            </form>
                            <table class="table table-sm table-striped">
                                <thead><tr><th>ID</th><th>Omschrijving</th><th>Reden</th><th>Actie</th></tr></thead>
                                <tbody id="cisTable"></tbody>
                            </table>
                        </div>

                        <div class="tab-pane fade" id="tabHist">
                            <table class="table table-sm text-muted small">
                                <thead><tr><th>Tijd</th><th>Wie</th><th>Type</th></tr></thead>
                                <tbody id="histTable"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let allAssets = [];
        let currentAssetId = null;
        let isGlobalRevealed = false; // Houdt bij of het oogje 'aan' staat

        // --- INIT ---
        loadSubs();
        loadAssets();

        // --- GLOBAL REVEAL FUNCTION ---
        function toggleGlobalReveal() {
            isGlobalRevealed = !isGlobalRevealed; // Wissel status
            
            const btn = document.getElementById('globalEyeBtn');
            const icon = btn.querySelector('i');
            
            // Verander knop uiterlijk
            if (isGlobalRevealed) {
                btn.classList.remove('btn-outline-secondary');
                btn.classList.add('btn-warning');
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                btn.classList.remove('btn-warning');
                btn.classList.add('btn-outline-secondary');
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }

            // Update alle velden die nu op het scherm staan
            document.querySelectorAll('.masked-data').forEach(el => {
                if (isGlobalRevealed) el.classList.add('revealed');
                else el.classList.remove('revealed');
            });
        }

        // --- DATA LOADING ---
        async function loadAssets() {
            const res = await fetch('/api/assets');
            if(res.status === 401) { window.location.href = '/login.html'; return; }
            allAssets = await res.json();
            renderTable(allAssets);
        }

        async function loadSubs() {
            const res = await fetch('/api/subscriptions');
            if(res.ok) {
                const subs = await res.json();
                const sel = document.getElementById('subSelect');
                sel.innerHTML = '<option value="">Kies...</option>';
                subs.forEach(s => sel.innerHTML += `<option value="${s.name}">${s.name}</option>`);
            }
        }

        // --- RENDER TABLE ---
        function renderTable(data) {
            const tbody = document.getElementById('assetTable');
            tbody.innerHTML = '';
            
            data.forEach(a => {
                let rowClass = 'public';
                if(a.classification === 'Internal') rowClass = 'internal';
                if(a.classification === 'Confidential') rowClass = 'confidential';

                let cisColor = a.cis_score < 50 ? 'text-danger fw-bold' : (a.cis_score < 70 ? 'text-warning' : 'text-success');
                let vulnBadge = a.vuln_count > 0 ? `<span class="badge bg-danger">${a.vuln_count}</span>` : `<span class="badge bg-success">0</span>`;
                const labels = a.data_sensitivity ? a.data_sensitivity.split(',').map(l => `<span class="badge bg-secondary me-1">${l}</span>`).join('') : '-';

                // Als het globale oogje aan staat, moeten nieuwe rijen ook direct zichtbaar zijn
                const revealedClass = isGlobalRevealed ? 'revealed' : '';

                tbody.innerHTML += `
                    <tr class="${rowClass}">
                        <td>
                            <span class="clickable-asset" onclick="openDetailModal(${a.id}, '${a.name}')">${a.name}</span><br>
                            <small class="text-muted">${a.type}</small>
                        </td>
                        <td><span class="masked-data ${revealedClass}" onclick="this.classList.toggle('revealed')">${a.ip_address}</span></td>
                        <td><span class="masked-data ${revealedClass}" onclick="this.classList.toggle('revealed')">${a.subscription_id}</span></td>
                        <td><span class="masked-data ${revealedClass}" onclick="this.classList.toggle('revealed')">${a.owner_contact}</span></td>
                        <td>${labels}</td>
                        <td class="${cisColor}">${a.cis_score || 0}%</td>
                        <td>${vulnBadge}</td>
                        <td>${a.classification}</td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-primary" onclick="openEditModal(${a.id})"><i class="bi bi-pencil"></i></button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteAsset(${a.id})"><i class="bi bi-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        // --- DETAIL MODAL LOGIC (Met Error Handling) ---
        async function openDetailModal(id, name) {
            currentAssetId = id;
            document.getElementById('detailTitle').innerText = `Details voor: ${name}`;
            
            try {
                const res = await fetch(`/api/asset-details?id=${id}`);
                
                // HIER controleren we of de API wel bestaat/JSON teruggeeft
                if(res.headers.get("content-type") && res.headers.get("content-type").includes("text/html")) {
                    alert("Fout: De API 'asset-details' kon niet worden geladen (HTML ontvangen). Check of functions/api/asset-details.js bestaat!");
                    return;
                }
                if(!res.ok) { alert("API Fout: " + res.status); return; }

                const data = await res.json();
                
                // Render Vulns
                const vTable = document.getElementById('vulnTable');
                vTable.innerHTML = '';
                data.vulnerabilities.forEach(v => {
                    vTable.innerHTML += `
                        <tr>
                            <td>${v.name}</td>
                            <td><span class="badge bg-${v.severity === 'Critical' ? 'danger' : 'warning'}">${v.severity}</span></td>
                            <td>${v.status}</td>
                            <td>${v.due_date || '-'}</td>
                            <td><i class="bi bi-trash text-danger" style="cursor:pointer" onclick="deleteDetail('vuln', ${v.id})"></i></td>
                        </tr>`;
                });

                // Render CIS
                const cTable = document.getElementById('cisTable');
                cTable.innerHTML = '';
                data.cis.forEach(c => {
                    cTable.innerHTML += `<tr><td>${c.control_id}</td><td>${c.description}</td><td>${c.justification}</td><td><i class="bi bi-trash text-danger" style="cursor:pointer" onclick="deleteDetail('cis', ${c.id})"></i></td></tr>`;
                });

                // Render History
                const hTable = document.getElementById('histTable');
                hTable.innerHTML = '';
                data.history.forEach(h => {
                    hTable.innerHTML += `<tr><td>${new Date(h.timestamp).toLocaleString()}</td><td>${h.changed_by}</td><td>${h.change_type}</td></tr>`;
                });

                new bootstrap.Modal(document.getElementById('detailModal')).show();

            } catch (e) {
                console.error(e);
                alert("Er ging iets mis bij het openen van de details. Zie console.");
            }
        }

        // --- OVERIGE FUNCTIES (ADD/DELETE) ---
        async function addVuln() {
            const body = {
                type: 'vuln', asset_id: currentAssetId,
                name: document.getElementById('vName').value,
                severity: document.getElementById('vSev').value,
                status: document.getElementById('vStat').value,
                due_date: document.getElementById('vDate').value
            };
            await fetch('/api/asset-details', { method: 'POST', body: JSON.stringify(body) });
            document.getElementById('vulnForm').reset();
            openDetailModal(currentAssetId, document.getElementById('detailTitle').innerText.replace('Details voor: ', ''));
            loadAssets();
        }

        async function addCis() {
            const body = {
                type: 'cis', asset_id: currentAssetId,
                control_id: document.getElementById('cId').value,
                description: document.getElementById('cDesc').value,
                justification: document.getElementById('cJust').value
            };
            await fetch('/api/asset-details', { method: 'POST', body: JSON.stringify(body) });
            document.getElementById('cisForm').reset();
            openDetailModal(currentAssetId, document.getElementById('detailTitle').innerText.replace('Details voor: ', ''));
        }

        async function deleteDetail(type, id) {
            if(!confirm("Verwijderen?")) return;
            await fetch('/api/asset-details', { method: 'DELETE', body: JSON.stringify({type, id}) });
            const name = document.getElementById('detailTitle').innerText.replace('Details voor: ', '');
            openDetailModal(currentAssetId, name);
            loadAssets();
        }

        // --- ASSET MODAL FUNCTIES ---
        function openCreateModal() {
            document.getElementById('assetForm').reset();
            document.getElementById('assetId').value = ''; 
            document.getElementById('modalTitle').innerText = 'Nieuwe Asset';
            new bootstrap.Modal(document.getElementById('assetModal')).show();
        }

        function openEditModal(id) {
            const asset = allAssets.find(a => a.id === id);
            document.getElementById('assetId').value = id;
            document.getElementById('name').value = asset.name;
            document.getElementById('type').value = asset.type;
            document.getElementById('cis').value = asset.cis_score;
            document.getElementById('subSelect').value = asset.subscription_id; 
            document.getElementById('owner').value = asset.owner_contact;
            document.getElementById('ip').value = asset.ip_address;
            document.getElementById('classif').value = asset.classification;
            document.querySelectorAll('.sens-check').forEach(c => c.checked = (asset.data_sensitivity || '').includes(c.value));
            document.getElementById('modalTitle').innerText = 'Asset Bewerken';
            new bootstrap.Modal(document.getElementById('assetModal')).show();
        }

        async function saveAsset() {
            const id = document.getElementById('assetId').value;
            const sens = []; document.querySelectorAll('.sens-check:checked').forEach(c => sens.push(c.value));
            const body = {
                id: id ? id : null,
                name: document.getElementById('name').value,
                type: document.getElementById('type').value,
                cis_score: document.getElementById('cis').value,
                subscription_id: document.getElementById('subSelect').value,
                owner_contact: document.getElementById('owner').value,
                ip_address: document.getElementById('ip').value,
                classification: document.getElementById('classif').value,
                data_sensitivity: sens
            };
            const res = await fetch('/api/assets', { method: id ? 'PUT' : 'POST', body: JSON.stringify(body) });
            if(res.ok) {
                bootstrap.Modal.getInstance(document.getElementById('assetModal')).hide();
                loadAssets();
            } else alert(await res.text());
        }

        async function deleteAsset(id) {
            if(confirm("Verwijderen?")) {
                await fetch('/api/assets', { method: 'DELETE', body: JSON.stringify({id}) });
                loadAssets();
            }
        }
        
        function filterTable() {
            const term = document.getElementById('searchBar').value.toLowerCase();
            const filtered = allAssets.filter(a => a.name.toLowerCase().includes(term) || a.ip_address.toLowerCase().includes(term));
            renderTable(filtered);
        }
    </script>
</body>
</html>

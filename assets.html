<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Asset Inventory (Secured)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .confidential { border-left: 5px solid #dc3545; background-color: #fff8f8; }
        .internal { border-left: 5px solid #ffc107; }
        .public { border-left: 5px solid #198754; }
        .secret { border-left: 5px solid #000; background-color: #f0f0f0; }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand"><i class="bi bi-shield-shaded"></i> Asset Inventory</span>
            <a href="/" class="btn btn-outline-light btn-sm">Terug naar Dashboard</a>
        </div>
    </nav>

    <div class="container">
        <button class="btn btn-primary mb-3" data-bs-toggle="collapse" data-bs-target="#newAssetForm">
            <i class="bi bi-plus-lg"></i> Nieuwe Asset Toevoegen
        </button>

        <div class="collapse mb-4" id="newAssetForm">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">Nieuwe Asset Registreren</div>
                <div class="card-body">
                    <form id="assetForm" class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Asset Naam (Hostname)</label>
                            <input type="text" id="name" class="form-control" required placeholder="bv. prod-db-01">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Type</label>
                            <select id="type" class="form-select">
                                <option>Virtual Machine</option>
                                <option>SQL Database</option>
                                <option>Storage Account</option>
                                <option>App Service</option>
                                <option>Firewall</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">CIS Score (%)</label>
                            <input type="number" id="cis" class="form-control" placeholder="0-100">
                        </div>

                        <div class="col-12"><hr></div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-danger"><i class="bi bi-lock"></i> IP Adres (Versleuteld)</label>
                            <input type="text" id="ip" class="form-control" placeholder="192.168.x.x">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-danger"><i class="bi bi-lock"></i> Subscription ID (Versleuteld)</label>
                            <input type="text" id="subId" class="form-control" placeholder="GUID">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-danger"><i class="bi bi-lock"></i> Eigenaar (Versleuteld)</label>
                            <input type="text" id="owner" class="form-control" placeholder="email@bedrijf.nl">
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Classificatie</label>
                            <select id="classif" class="form-select">
                                <option value="Public">Public (Groen)</option>
                                <option value="Internal">Internal (Geel)</option>
                                <option value="Confidential">Confidential (Rood)</option>
                                <option value="Secret">Secret (Zwart)</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Data Gevoeligheid</label>
                            <select id="sens" class="form-select">
                                <option value="None">Geen</option>
                                <option value="PII">PII (Persoonsgegevens)</option>
                                <option value="PHI">PHI (Medisch)</option>
                                <option value="PCI">PCI (Creditcard)</option>
                            </select>
                        </div>

                        <div class="col-12 text-end">
                            <button type="submit" class="btn btn-success">Opslaan & Versleutelen</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Asset</th>
                            <th>Info</th>
                            <th>Compliance</th>
                            <th>Classificatie</th>
                            <th>Gevoelige Info (Ontsleuteld)</th>
                            <th>Actie</th>
                        </tr>
                    </thead>
                    <tbody id="assetTable">
                        <tr><td colspan="6" class="text-center p-4">Laden...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        loadAssets();

        async function loadAssets() {
            try {
                const res = await fetch('/api/assets');
                if(!res.ok) {
                    if(res.status === 500) alert("Server Config Fout: Check of ENCRYPTION_KEY is ingesteld in Cloudflare!");
                    return;
                }
                const assets = await res.json();
                
                const tbody = document.getElementById('assetTable');
                tbody.innerHTML = '';

                assets.forEach(a => {
                    // Bepaal kleurklasse
                    let rowClass = 'public';
                    if(a.classification === 'Internal') rowClass = 'internal';
                    if(a.classification === 'Confidential') rowClass = 'confidential';
                    if(a.classification === 'Secret') rowClass = 'secret';

                    // Kleur CIS score
                    let cisColor = 'text-success';
                    if(a.cis_score < 70) cisColor = 'text-warning';
                    if(a.cis_score < 50) cisColor = 'text-danger fw-bold';

                    const row = `
                        <tr class="${rowClass}">
                            <td>
                                <strong>${a.name}</strong><br>
                                <span class="text-muted small">${a.type}</span>
                            </td>
                            <td>
                                <span class="badge bg-light text-dark border">Data: ${a.data_sensitivity}</span>
                            </td>
                            <td>
                                CIS: <span class="${cisColor}">${a.cis_score}%</span>
                            </td>
                            <td>${a.classification}</td>
                            <td class="small">
                                <div><i class="bi bi-globe"></i> ${a.ip_address || '-'}</div>
                                <div><i class="bi bi-key"></i> ${a.subscription_id || '-'}</div>
                                <div><i class="bi bi-person"></i> ${a.owner_contact || '-'}</div>
                            </td>
                            <td>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteAsset(${a.id})"><i class="bi bi-trash"></i></button>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } catch(e) { console.error(e); }
        }

        document.getElementById('assetForm').onsubmit = async (e) => {
            e.preventDefault();
            const data = {
                name: document.getElementById('name').value,
                type: document.getElementById('type').value,
                cis_score: document.getElementById('cis').value,
                ip_address: document.getElementById('ip').value,
                subscription_id: document.getElementById('subId').value,
                owner_contact: document.getElementById('owner').value,
                classification: document.getElementById('classif').value,
                data_sensitivity: document.getElementById('sens').value
            };

            const res = await fetch('/api/assets', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });

            if(res.ok) {
                alert("Asset versleuteld opgeslagen!");
                document.getElementById('assetForm').reset();
                loadAssets();
            } else {
                alert("Fout: " + await res.text());
            }
        };

        async function deleteAsset(id) {
            if(!confirm("Verwijderen?")) return;
            await fetch('/api/assets', { method: 'DELETE', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id}) });
            loadAssets();
        }
    </script>
</body>
</html>

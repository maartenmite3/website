<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Trend Analyse - Security Center</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand"><i class="bi bi-graph-up-arrow"></i> Trend Analyse</span>
            <div class="d-flex gap-3 align-items-center">
                <a class="nav-link text-white" href="/assets.html">Terug naar Assets</a>
                <a href="/" class="btn btn-outline-light btn-sm">Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3>Voortgang & Trends</h3>
            <div class="btn-group" role="group">
                <button type="button" class="btn btn-outline-primary active" onclick="updateCharts('7')">7 Dagen</button>
                <button type="button" class="btn btn-outline-primary" onclick="updateCharts('30')">30 Dagen</button>
                <button type="button" class="btn btn-outline-primary" onclick="updateCharts('90')">Kwartaal</button>
                <button type="button" class="btn btn-outline-primary" onclick="updateCharts('365')">Jaar</button>
                <button type="button" class="btn btn-outline-primary" onclick="updateCharts('all')">Alles</button>
            </div>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-md-6">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-white fw-bold">Groei van Resources & Subscripties</div>
                    <div class="card-body"><canvas id="growthChart"></canvas></div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-white fw-bold">Eigenaarschap (%)</div>
                    <div class="card-body"><canvas id="ownerChart"></canvas></div>
                </div>
            </div>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-md-6">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-white fw-bold">Kwetsbaarheden (Open)</div>
                    <div class="card-body"><canvas id="vulnChart"></canvas></div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-white fw-bold">CIS Score Voortgang</div>
                    <div class="card-body"><canvas id="cisChart"></canvas></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let fullData = [];
        let charts = {};

        // Laad data bij start
        loadTrends();

        async function loadTrends() {
            try {
                const res = await fetch('/api/trends');
                fullData = await res.json();
                
                // Als er geen data is (eerste keer opstarten)
                if(fullData.length === 0) {
                    alert("Eerste keer opstarten: Data snapshot wordt gemaakt. Ververs de pagina.");
                    location.reload();
                    return;
                }

                initCharts();
                updateCharts('7'); // Standaard week weergave

            } catch(e) { console.error(e); }
        }

        function updateCharts(range) {
            // Update actieve knop styling
            document.querySelectorAll('.btn-group .btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            // Data filteren (Slicen)
            let data = [];
            if (range === 'all') data = fullData;
            else {
                const limit = parseInt(range);
                data = fullData.slice(-limit); // Pak de laatste X items
            }

            const labels = data.map(d => d.date);

            // 1. Groei Chart (Line - Dubbele as)
            charts.growth.data.labels = labels;
            charts.growth.data.datasets[0].data = data.map(d => d.total_assets);
            charts.growth.data.datasets[1].data = data.map(d => d.total_subs);
            charts.growth.update();

            // 2. Owner Chart (Line/Area)
            charts.owner.data.labels = labels;
            charts.owner.data.datasets[0].data = data.map(d => d.ownership_percentage);
            charts.owner.update();

            // 3. Vuln Chart (Bar gestapeld of Lijn)
            charts.vuln.data.labels = labels;
            charts.vuln.data.datasets[0].data = data.map(d => d.vuln_critical);
            charts.vuln.data.datasets[1].data = data.map(d => d.vuln_high);
            charts.vuln.update();

            // 4. CIS Chart
            charts.cis.data.labels = labels;
            charts.cis.data.datasets[0].data = data.map(d => d.avg_cis);
            charts.cis.update();
        }

        function initCharts() {
            // Configuratie helpers
            const commonOptions = { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false } };

            // 1. Growth
            const ctx1 = document.getElementById('growthChart').getContext('2d');
            charts.growth = new Chart(ctx1, {
                type: 'line',
                data: {
                    datasets: [
                        { label: 'Assets', borderColor: '#0d6efd', backgroundColor: '#0d6efd', tension: 0.3 },
                        { label: 'Subscriptions', borderColor: '#198754', backgroundColor: '#198754', tension: 0.3, yAxisID: 'y1' }
                    ]
                },
                options: { ...commonOptions, scales: { y: { beginAtZero: true }, y1: { position: 'right', grid: { drawOnChartArea: false } } } }
            });

            // 2. Owner
            const ctx2 = document.getElementById('ownerChart').getContext('2d');
            charts.owner = new Chart(ctx2, {
                type: 'line',
                data: {
                    datasets: [{ label: '% Met Eigenaar', borderColor: '#fd7e14', backgroundColor: 'rgba(253, 126, 20, 0.1)', fill: true, tension: 0.4 }]
                },
                options: { ...commonOptions, scales: { y: { min: 0, max: 100 } } }
            });

            // 3. Vuln
            const ctx3 = document.getElementById('vulnChart').getContext('2d');
            charts.vuln = new Chart(ctx3, {
                type: 'bar',
                data: {
                    datasets: [
                        { label: 'Critical', backgroundColor: '#dc3545' },
                        { label: 'High', backgroundColor: '#ffc107' }
                    ]
                },
                options: { ...commonOptions, scales: { x: { stacked: true }, y: { stacked: true } } }
            });

            // 4. CIS
            const ctx4 = document.getElementById('cisChart').getContext('2d');
            charts.cis = new Chart(ctx4, {
                type: 'line',
                data: {
                    datasets: [{ label: 'Gemiddelde CIS Score', borderColor: '#6610f2', tension: 0.4, borderDash: [5, 5] }]
                },
                options: { ...commonOptions, scales: { y: { min: 0, max: 100 } } }
            });
        }
    </script>
</body>
</html>
